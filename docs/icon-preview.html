<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Codex Controller Lucide icon preview</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #080c11; color: #f8fafc; }
    main { width: 920px; margin: 28px auto; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 24px 0 10px; color: #94a3b8; font-size: 17px; text-transform: uppercase; letter-spacing: .08em; }
    .grid { display: grid; grid-template-columns: repeat(5, 160px); gap: 18px; }
    .commands { grid-template-columns: repeat(4, 160px); }
    .wheel { grid-template-columns: repeat(3, 180px); }
    figure { margin: 0; padding: 12px; border: 0; border-radius: 18px; background: #000; text-align: center; }
    figure img { display: block; width: 100%; aspect-ratio: 1; }
    figcaption { margin-top: 7px; color: #cbd5e1; font-size: 14px; }
    .native { display: grid; place-items: center; aspect-ratio: 1; border: 2px dashed #64748b; border-radius: 20px; color: #94a3b8; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Codex Controller · Lucide / shadcn icon set</h1>
    <h2>Commands page</h2>
    <section class="grid commands">
      <figure><img src="../src/icons/new_chat.svg" alt="New Chat square pen"><figcaption>New Chat · SquarePen</figcaption></figure>
      <figure><img src="../src/icons/quick_chat.svg" alt="Quick Chat messages"><figcaption>Quick Chat · MessagesSquare</figcaption></figure>
      <figure><img src="../src/icons/side_chat.svg" alt="Side Chat message plus"><figcaption>Side Chat · MessageCirclePlus</figcaption></figure>
      <figure><img src="../src/icons/search_chats.svg" alt="Search chats"><figcaption>Search Chats · Search</figcaption></figure>
      <figure><img src="../src/icons/open_folder.svg" alt="Open folder"><figcaption>Open Folder · FolderOpen</figcaption></figure>
      <figure><img src="../src/icons/command_menu.svg" alt="Command menu"><figcaption>Command Menu · Command</figcaption></figure>
      <figure><img src="../src/icons/review_tab.svg" alt="Review panel"><figcaption>Review Panel · PanelRight</figcaption></figure>
      <figure><img src="../src/icons/toggle_terminal.svg" alt="Terminal"><figcaption>Terminal · SquareTerminal</figcaption></figure>
      <figure><img src="../src/icons/toggle_bottom.svg" alt="Bottom panel"><figcaption>Bottom Panel · PanelBottom</figcaption></figure>
      <figure><img src="../src/icons/toggle_sidebar.svg" alt="Sidebar"><figcaption>Sidebar · PanelLeft</figcaption></figure>
      <figure><img src="../src/icons/dictation.svg" alt="Dictation microphone"><figcaption>Dictate · Mic</figcaption></figure>
      <figure><img src="../src/icons/shortcut_help.svg" alt="Keyboard shortcuts"><figcaption>Shortcut Help · Keyboard</figcaption></figure>
    </section>
    <h2>Agents page</h2>
    <section class="grid commands">
      <figure><img src="../src/icons/previous_agent.svg" alt="Previous agent"><figcaption>Previous Agent · ArrowLeft</figcaption></figure>
      <figure><img src="../src/icons/next_agent.svg" alt="Next agent"><figcaption>Next Agent · ArrowRight</figcaption></figure>
      <figure><img src="../src/icons/search_chats.svg" alt="Search chats"><figcaption>Search Chats · Search</figcaption></figure>
      <figure><img src="../src/icons/new_chat.svg" alt="New chat"><figcaption>New Chat · SquarePen</figcaption></figure>
      <figure><img src="../src/icons/side_chat.svg" alt="Side chat"><figcaption>Side Chat · MessageCirclePlus</figcaption></figure>
      <figure><img src="../src/icons/standalone_chat.svg" alt="Standalone chat"><figcaption>Standalone · MessageSquareDashed</figcaption></figure>
      <figure><img src="../src/icons/continue_new.svg" alt="Fork chat"><figcaption>Fork · Split, 90° clockwise</figcaption></figure>
      <figure><img src="../src/icons/archive_chat.svg" alt="Archive chat"><figcaption>Archive · Archive</figcaption></figure>
      <figure><img src="../src/icons/toggle_pin.svg" alt="Pin chat"><figcaption>Pin / Unpin · Pin</figcaption></figure>
      <figure><img src="../src/icons/copy_markdown.svg" alt="Copy Markdown"><figcaption>Copy Markdown · ClipboardCopy</figcaption></figure>
      <figure><img src="../src/icons/agent_status.svg" alt="Agent status"><figcaption>Status · Activity</figcaption></figure>
      <figure><img src="../src/icons/handoff.svg" alt="Handoff summary"><figcaption>Handoff · Summary</figcaption></figure>
    </section>
    <h2>Center wheel</h2>
    <section class="grid wheel">
      <figure><img src="../src/icons/plan_toggle.svg" alt="Plan lightbulb"><figcaption>Plan · Lightbulb</figcaption></figure>
      <figure><img src="../src/icons/reason_cycle.svg" alt="Reasoning brain circuit"><figcaption>Reasoning · BrainCircuit</figcaption></figure>
      <figure><img src="../src/icons/fast_toggle.svg" alt="Fast lightning"><figcaption>Fast · Zap</figcaption></figure>
    </section>
    <h2>Small dials</h2>
    <section class="grid">
      <figure><img src="../src/icons/dial_agents.svg" alt="Agents bot"><figcaption>Agents · Bot</figcaption></figure>
      <figure><img src="../src/icons/dial_transcript.svg" alt="Transcript scroll"><figcaption>Transcript · ScrollText</figcaption></figure>
      <figure><img src="../src/icons/dial_font_size.svg" alt="Font size type"><figcaption>Font Size · Type</figcaption></figure>
      <figure><img src="../src/icons/dial_reasoning.svg" alt="Reasoning brain circuit"><figcaption>Reasoning · BrainCircuit</figcaption></figure>
      <figure><img src="../src/icons/dial_tabs.svg" alt="Tabs panels"><figcaption>Tabs · PanelsTopLeft</figcaption></figure>
      <figure><div class="native">LOUPEDECK<br>NATIVE</div><figcaption>System Volume</figcaption></figure>
    </section>
  </main>
</body>
</html>
